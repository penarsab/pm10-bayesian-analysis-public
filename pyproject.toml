[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pm10-bayesian-analysis-public"
version = "1.0.0"
description = "Public replication package for PM10 Bayesian analysis manuscript figures and tables."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas",
  "numpy",
  "matplotlib",
  "statsmodels",
  "pyyaml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
